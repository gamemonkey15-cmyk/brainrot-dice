
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roll Color Dice</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  color: white;
  background: linear-gradient(135deg, #101426, #29204b);
}

main {
  width: min(100%, 750px);
  text-align: center;
}

h1 {
  font-size: clamp(2rem, 6vw, 3rem);
  margin-bottom: 10px;
}

.dice {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 18px;
  margin: 40px 0;
}

.die {
  aspect-ratio: 1;
  width: 100%;
  padding: 18%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  border: 3px solid white;
  border-radius: 20%;
  box-shadow: 0 7px 0 #0005;
  transition: background-color 0.2s;
}

.pip {
  grid-area: 2 / 2;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: white;
}

.rolling {
  animation: shake 0.12s infinite alternate;
}

@keyframes shake {
  from { transform: rotate(-8deg) scale(.95); }
  to { transform: rotate(8deg) scale(1.05); }
}

button {
  padding: 16px 30px;
  border: 0;
  border-radius: 12px;
  background: #a8a0ff;
  color: #15152c;
  font-size: 1.1rem;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  filter: brightness(1.1);
}

button:disabled {
  opacity: 0.7;
  cursor: wait;
}

@media (max-width: 520px) {
  body { padding: 16px; }
  .dice { grid-template-columns: repeat(2, 1fr); gap: 24px; }
}
</style>
</head>

<body>
<main>
  <h1>🎲 Roll Color Dice</h1>

  <div class="dice" id="dice">
    <div class="die"><span class="pip"></span></div>
    <div class="die"><span class="pip"></span></div>
    <div class="die"><span class="pip"></span></div>
    <div class="die"><span class="pip"></span></div>
  </div>

  <button id="roll">🎲 Roll Colors</button>
</main>

<script>
const colors = [
  "#f04452", // Red
  "#ff8a32", // Orange
  "#ffd447", // Yellow
  "#24b96b", // Green
  "#3988ff", // Blue
  "#9b61f4"  // Purple
];

const dice = document.querySelectorAll(".die");
const button = document.querySelector("#roll");

function rollDice() {
  button.disabled = true;

  dice.forEach(die => {
    die.classList.add("rolling");
  });

  setTimeout(() => {
    dice.forEach(die => {
      const randomIndex = Math.floor(Math.random() * colors.length);
      die.style.backgroundColor = colors[randomIndex];
    });

    dice.forEach(die => {
      die.classList.remove("rolling");
    });

    button.disabled = false;
  }, 450);
}

button.addEventListener("click", rollDice);

// Start with four dice showing 1, each in a random color.
rollDice();
</script>
</body>
</html>
